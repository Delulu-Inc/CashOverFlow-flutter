<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Cash Overflow helps businesses predict cash shortages before they happen, understand their causes and simulate decisions with AI-powered cash-flow forecasting.">
  <meta name="theme-color" content="#07080C">

  <!-- Link previews (WhatsApp, LinkedIn, Slack, ...) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Cash Overflow">
  <meta property="og:title" content="Cash Overflow – Predict, Prevent, Plan ahead.">
  <meta property="og:description" content="AI-powered cash-flow forecasting, risk detection and what-if simulations.">
  <meta property="og:image" content="icons/Icon-512.png">
  <meta name="twitter:card" content="summary">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Cash Overflow">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Cash Overflow</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #07080C; }

    /* Shown while the Flutter engine downloads, removed on the first frame. */
    #app-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #07080C;
      transition: opacity 0.3s ease;
    }
    #app-loader.hidden { opacity: 0; pointer-events: none; }
    #app-loader .spinner {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 3px solid rgba(252, 252, 252, 0.15);
      border-top-color: #1A46C2;
      animation: app-loader-spin 0.8s linear infinite;
    }
    @keyframes app-loader-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      #app-loader .spinner { animation-duration: 2.4s; }
    }
  </style>
</head>
<body>
  <div id="app-loader" role="progressbar" aria-label="Loading Cash Overflow">
    <div class="spinner"></div>
  </div>
  <script>
    (function () {
      function hideLoader() {
        var loader = document.getElementById('app-loader');
        if (!loader) return;
        loader.classList.add('hidden');
        setTimeout(function () { loader.remove(); }, 400);
      }
      window.addEventListener('flutter-first-frame', hideLoader, { once: true });
      // Safety net: never keep the loader if the event is missed.
      setTimeout(hideLoader, 15000);
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
